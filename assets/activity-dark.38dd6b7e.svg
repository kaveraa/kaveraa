<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" role="img" aria-label="Activity">
  <title>Activity</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .cell { opacity: 0; animation: pop .5s cubic-bezier(.2,.7,.2,1) forwards; transform-box: fill-box; transform-origin: center; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .out { opacity: 0; animation: show .01s linear forwards; }
    .grow { transform: scaleX(0); transform-origin: 0 0; animation: grow 1s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .cell, .rise, .out, .grow { animation: none; opacity: 1; transform: none; } }
    
  </style>
  <defs><clipPath id="frame"><rect width="900" height="288" rx="22"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="288" fill="#171012"/>
    <rect x="0.5" y="0.5" width="899" height="287" rx="22" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <g class="rise" style="animation-delay:0.10s">
      <rect x="32.0" y="32" width="198.5" height="84" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
