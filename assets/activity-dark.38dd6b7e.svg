      <rect x="468" y="192" width="289" height="4" rx="2" fill="#6fa89c" class="grow" style="animation-delay:0.81s"/>
    </g><g class="rise" style="animation-delay:0.78s">
      <text x="32" y="216" font-size="12" font-weight="600" fill="#faf6f3">Twig</text>
