<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Augustin Kavera, Full-stack developer">
  <title>Augustin Kavera · Full-stack developer</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity: 0; animation: fade .9s ease-out forwards; }
    .draw { animation: draw 1.6s cubic-bezier(.4,0,.2,1) forwards; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .fade, .draw { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="900" height="280" rx="24"/></clipPath>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a93226" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a93226" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(28,25,23,0.05)"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="#fcfafa"/>
    <rect width="900" height="280" fill="url(#dots)"/>
    <rect x="0.5" y="0.5" width="899" height="279" rx="24" fill="none" stroke="rgba(28,25,23,0.10)"/>

    <!-- left column -->
    <g class="rise" style="animation-delay:.05s">
      <rect x="44" y="44" width="178" height="24" rx="12" fill="rgba(28,25,23,0.04)" stroke="rgba(28,25,23,0.10)"/>
      <circle cx="58" cy="56" r="4" fill="#a93226"/>
      <text x="70" y="60" font-size="11.5" font-weight="600" letter-spacing=".4" fill="#57504c">FULL-STACK DEVELOPER</text>
    </g>
    <text class="rise" style="animation-delay:.2s" x="44" y="120" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#1c1917">Augustin Kavera</text>
    <g class="rise" style="animation-delay:.4s">
      <text x="44" y="152" font-size="15" fill="#57504c">Auvergne, France</text>
    </g>
    <g class="fade" style="animation-delay:.7s">
      <text class="mono" x="44" y="200" font-size="14" fill="#a93226">$</text>
      
    <clipPath id="tw0"><rect x="62" y="186" height="22.400000000000002" width="0">
      <animate attributeName="width" values="0;0;436.8;436.8;0;0" keyTimes="0;0.0000;0.1222;0.2667;0.3167;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect></clipPath>
    <text class="mono" x="62" y="200" font-size="14" fill="#57504c" clip-path="url(#tw0)" textLength="436.8" lengthAdjust="spacingAndGlyphs">I build line-of-business apps for the public sector.</text>
    <rect class="cursor" x="62" y="187" width="2" height="17" fill="#a93226" opacity="0">
      <animate attributeName="x" values="62;62;498.8;498.8;62;62" keyTimes="0;0.0000;0.1222;0.2667;0.3167;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.0000;0.1222;0.2667;0.3167;1" calcMode="discrete" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect>
    <clipPath id="tw1"><rect x="62" y="186" height="22.400000000000002" width="0">
      <animate attributeName="width" values="0;0;436.8;436.8;0;0" keyTimes="0;0.3333;0.4556;0.6000;0.6500;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect></clipPath>
    <text class="mono" x="62" y="200" font-size="14" fill="#57504c" clip-path="url(#tw1)" textLength="436.8" lengthAdjust="spacingAndGlyphs">I ship small, focused packages on Packagist and npm.</text>
    <rect class="cursor" x="62" y="187" width="2" height="17" fill="#a93226" opacity="0">
      <animate attributeName="x" values="62;62;498.8;498.8;62;62" keyTimes="0;0.3333;0.4556;0.6000;0.6500;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.3333;0.4556;0.6000;0.6500;1" calcMode="discrete" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect>
    <clipPath id="tw2"><rect x="62" y="186" height="22.400000000000002" width="0">
      <animate attributeName="width" values="0;0;369.6;369.6;0;0" keyTimes="0;0.6667;0.7889;0.9333;0.9833;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect></clipPath>
    <text class="mono" x="62" y="200" font-size="14" fill="#57504c" clip-path="url(#tw2)" textLength="369.6" lengthAdjust="spacingAndGlyphs">I run Kadelio, a gift-list SaaS, end to end.</text>
    <rect class="cursor" x="62" y="187" width="2" height="17" fill="#a93226" opacity="0">
      <animate attributeName="x" values="62;62;431.6;431.6;62;62" keyTimes="0;0.6667;0.7889;0.9333;0.9833;1" calcMode="linear" dur="18.000000000000004s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.6667;0.7889;0.9333;0.9833;1" calcMode="discrete" dur="18.000000000000004s" repeatCount="indefinite"/>
    </rect>
    </g>

    <!-- right panel -->
    <g class="rise" style="animation-delay:.5s">
      <rect x="522" y="36" width="340" height="208" rx="18" fill="#ffffff" fill-opacity="0.75" stroke="rgba(28,25,23,0.10)"/>
      
      <g class="rise" style="animation-delay:0.80s">
        <text x="542" y="86" text-anchor="start" font-size="26" font-weight="800" letter-spacing="-.5" fill="#1c1917">8</text>
        <text x="542" y="104" text-anchor="start" font-size="10.5" font-weight="600" letter-spacing=".2" fill="#a39b96">PACKAGES</text>
      </g>
      <g class="rise" style="animation-delay:0.92s">
        <text x="658" y="86" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="-.5" fill="#1c1917">32</text>
        <text x="658" y="104" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing=".2" fill="#a39b96">RELEASES</text>
      </g>
      <g class="rise" style="animation-delay:1.04s">
        <text x="842" y="86" text-anchor="end" font-size="26" font-weight="800" letter-spacing="-.5" fill="#1c1917">1.2k</text>
        <text x="842" y="104" text-anchor="end" font-size="10.5" font-weight="600" letter-spacing=".2" fill="#a39b96">INSTALLS / MONTH</text>
      </g>
      <line x1="542" y1="126" x2="842" y2="126" stroke="rgba(28,25,23,0.10)"/>
      <text x="542" y="148" font-size="10.5" font-weight="600" letter-spacing=".3" fill="#a39b96"><tspan font-size="13" font-weight="800" fill="#1c1917">4k</tspan> CONTRIBUTIONS</text>
      <text x="842" y="148" text-anchor="end" font-size="10.5" font-weight="600" letter-spacing=".3" fill="#a39b96">LAST 16 WEEKS</text>
      
    <path d="M542.0 217.0 L562.0 210.6 L582.0 217.8 L602.0 219.5 L622.0 205.7 L642.0 211.3 L662.0 215.8 L682.0 217.0 L702.0 210.8 L722.0 216.8 L742.0 209.2 L762.0 218.2 L782.0 209.7 L802.0 214.7 L822.0 160.0 L842.0 202.3 L842.0 220 L542 220 Z" fill="url(#sparkFill)" class="fade" style="animation-delay:1.6s"/>
    <path d="M542.0 217.0 L562.0 210.6 L582.0 217.8 L602.0 219.5 L622.0 205.7 L642.0 211.3 L662.0 215.8 L682.0 217.0 L702.0 210.8 L722.0 216.8 L742.0 209.2 L762.0 218.2 L782.0 209.7 L802.0 214.7 L822.0 160.0 L842.0 202.3" fill="none" stroke="#a93226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="380" stroke-dashoffset="380" class="draw" style="animation-delay:1.1s"/>
    <circle cx="842.0" cy="202.3" r="3.5" fill="#a93226" class="fade" style="animation-delay:2.2s"/>
    </g>
  </g>
</svg>
