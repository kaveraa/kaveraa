<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Contributions per month and releases over the last twelve months">
  <title>Pulse</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .bar { transform: scaleY(0); transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .pop { opacity: 0; animation: pop .4s cubic-bezier(.2,.7,.2,1) forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .rise, .bar, .pop { animation: none; opacity: 1; transform: none; } }
  </style>
  <defs><clipPath id="frame"><rect width="900" height="230" rx="22"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="230" fill="#171012"/>
    <rect x="0.5" y="0.5" width="899" height="229" rx="22" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="36" font-size="11" font-weight="700" letter-spacing=".5" fill="#857a76">CONTRIBUTIONS PER MONTH · LAST 12 MONTHS</text>
    <text x="860" y="36" text-anchor="end" font-size="11" font-weight="700" letter-spacing=".5" fill="#857a76"><tspan font-size="13" font-weight="800" fill="#faf6f3">5.9k</tspan> CONTRIBUTIONS · <tspan font-size="13" font-weight="800" fill="#faf6f3">9</tspan> RELEASES</text>
    <line x1="40" y1="164" x2="860" y2="164" stroke="rgba(255,255,255,0.08)"/>
    
    <g class="rise" style="animation-delay:0.15s">
      <rect x="57.2" y="162" width="34" height="2" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.20s"/>
      <text x="74.2" y="154" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">55</text>
      <text x="74.2" y="182" text-anchor="middle" font-size="11" fill="#857a76">Dec</text>
      
    </g>
    <g class="rise" style="animation-delay:0.20s">
      <rect x="125.5" y="161" width="34" height="3" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.25s"/>
      <text x="142.5" y="153" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">84</text>
      <text x="142.5" y="182" text-anchor="middle" font-size="11" fill="#857a76">Jan</text>
      
    </g>
    <g class="rise" style="animation-delay:0.25s">
      <rect x="193.8" y="162" width="34" height="2" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.30s"/>
      <text x="210.8" y="154" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">71</text>
      <text x="210.8" y="182" text-anchor="middle" font-size="11" fill="#857a76">Feb</text>
      
    </g>
    <g class="rise" style="animation-delay:0.30s">
      <rect x="262.2" y="152" width="34" height="12" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.35s"/>
      <text x="279.2" y="144" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">385</text>
      <text x="279.2" y="182" text-anchor="middle" font-size="11" fill="#857a76">Mar</text>
      
    </g>
    <g class="rise" style="animation-delay:0.35s">
      <rect x="330.5" y="154" width="34" height="10" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.40s"/>
      <text x="347.5" y="146" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">326</text>
      <text x="347.5" y="182" text-anchor="middle" font-size="11" fill="#857a76">Apr</text>
      
    </g>
    <g class="rise" style="animation-delay:0.40s">
      <rect x="398.8" y="155" width="34" height="9" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.45s"/>
      <text x="415.8" y="147" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">280</text>
      <text x="415.8" y="182" text-anchor="middle" font-size="11" fill="#857a76">May</text>
      
    </g>
    <g class="rise" style="animation-delay:0.45s">
      <rect x="467.2" y="148" width="34" height="16" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.50s"/>
      <text x="484.2" y="140" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">520</text>
      <text x="484.2" y="182" text-anchor="middle" font-size="11" fill="#857a76">Jun</text>
      
    </g>
    <g class="rise" style="animation-delay:0.50s">
      <rect x="535.5" y="156" width="34" height="8" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.55s"/>
      <text x="552.5" y="148" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">240</text>
      <text x="552.5" y="182" text-anchor="middle" font-size="11" fill="#857a76">Jul</text>
      
    </g>
    <g class="rise" style="animation-delay:0.55s">
      <rect x="603.8" y="159" width="34" height="5" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.60s"/>
      <text x="620.8" y="151" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">164</text>
      <text x="620.8" y="182" text-anchor="middle" font-size="11" fill="#857a76">Aug</text>
      
    </g>
    <g class="rise" style="animation-delay:0.60s">
      <rect x="672.2" y="152" width="34" height="12" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.65s"/>
      <text x="689.2" y="144" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">386</text>
      <text x="689.2" y="182" text-anchor="middle" font-size="11" fill="#857a76">Sep</text>
      
    </g>
    <g class="rise" style="animation-delay:0.65s">
      <rect x="740.5" y="64" width="34" height="100" rx="4" fill="#7d2a22" class="bar" style="animation-delay:0.70s"/>
      <text x="757.5" y="56" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">3.2k</text>
      <text x="757.5" y="182" text-anchor="middle" font-size="11" fill="#857a76">Oct</text>
      <g class="pop" style="animation-delay:1.30s"><circle cx="757.5" cy="198" r="6" fill="#c0392b"/><text x="757.5" y="218" text-anchor="middle" font-size="10" class="mono" fill="#857a76">9</text></g>
    </g>
    <g class="rise" style="animation-delay:0.70s">
      <rect x="808.8" y="158" width="34" height="6" rx="4" fill="#c0392b" class="bar" style="animation-delay:0.75s"/>
      <text x="825.8" y="150" text-anchor="middle" font-size="10.5" class="mono" fill="#857a76">179</text>
      <text x="825.8" y="182" text-anchor="middle" font-size="11" fill="#857a76">Nov</text>
      
    </g>
    <text x="40" y="218" font-size="10" font-weight="600" letter-spacing=".3" fill="#857a76">● LATEST RELEASES</text>
  </g>
</svg>
