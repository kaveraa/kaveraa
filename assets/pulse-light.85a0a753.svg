      <text x="689.2" y="182" text-anchor="middle" font-size="11" fill="#a39b96">Sep</text>
      
    </g>
    <g class="rise" style="animation-delay:0.65s">
      <rect x="740.5" y="64" width="34" height="100" rx="4" fill="#dc9a8e" class="bar" style="animation-delay:0.70s"/>
