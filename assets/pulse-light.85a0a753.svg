<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Contributions per month and releases over the last twelve months">
  <title>Pulse</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .bar { transform: scaleY(0); transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .pop { opacity: 0; animation: pop .4s cubic-bezier(.2,.7,.2,1) forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .rise, .bar, .pop { animation: none; opacity: 1; transform: none; } }
  </style>
  <defs><clipPath id="frame"><rect width="900" height="230" rx="22"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="230" fill="#ffffff"/>
    <rect x="0.5" y="0.5" width="899" height="229" rx="22" fill="none" stroke="rgba(28,25,23,0.10)"/>
    <text x="40" y="36" font-size="11" font-weight="700" letter-spacing=".5" fill="#a39b96">CONTRIBUTIONS PER MONTH · LAST 12 MONTHS</text>
    <text x="860" y="36" text-anchor="end" font-size="11" font-weight="700" letter-spacing=".5" fill="#a39b96"><tspan font-size="13" font-weight="800" fill="#1c1917">663</tspan> CONTRIBUTIONS · <tspan font-size="13" font-weight="800" fill="#1c1917">9</tspan> RELEASES</text>
    <line x1="40" y1="164" x2="860" y2="164" stroke="rgba(28,25,23,0.10)"/>
    
    <g class="rise" style="animation-delay:0.15s">
      <rect x="57.2" y="162" width="34" height="2" rx="4" fill="#dc9a8e" class="bar" style="animation-delay:0.20s"/>
      <text x="74.2" y="154" text-anchor="middle" font-size="10.5" class="mono" fill="#a39b96"></text>
      <text x="74.2" y="182" text-anchor="middle" font-size="11" fill="#a39b96">Dec</text>
      
    </g>
    <g class="rise" style="animation-delay:0.20s">
