<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-label="Stack">
  <title>Stack</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .out { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .out { animation: none; opacity: 1; } #c rect { animation: none; width: 900px; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="900" height="274" rx="22"/></clipPath>
    <clipPath id="c"><rect x="28" y="26" width="0" height="24"><animate attributeName="width" from="15.6" to="97.6" dur="0.40s" begin="0.2s" fill="freeze"/></rect></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="274" fill="#141518"/>
    <rect x="0.5" y="0.5" width="899" height="273" rx="22" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <g clip-path="url(#c)"><text class="mono" x="28" y="44" font-size="13" font-weight="700" fill="#c0392b" textLength="7.8" lengthAdjust="spacingAndGlyphs">$</text><text class="mono" x="43.6" y="44" font-size="13" font-weight="600" fill="#f3f4f6" textLength="78.0" lengthAdjust="spacingAndGlyphs">tree stack</text></g>
    <g class="out" style="animation-delay:.8s"><text class="mono" x="28" y="74" font-size="13" font-weight="400" fill="#9ca3af" textLength="39.0" lengthAdjust="spacingAndGlyphs">stack</text></g>
    <g class="out" style="animation-delay:0.90s"><text class="mono" x="28" y="96" font-size="13" fill="#6b7280">├──</text><text class="mono" x="59.2" y="96" font-size="13" font-weight="700" fill="#c0392b" textLength="62.4" lengthAdjust="spacingAndGlyphs">back-end</text></g>
    <g class="out" style="animation-delay:1.00s"><text class="mono" x="28" y="117" font-size="13" fill="#6b7280">│</text><text class="mono" x="59.2" y="117" font-size="13" fill="#6b7280">└──</text><text class="mono" x="90.4" y="117" font-size="13" font-weight="400" fill="#f3f4f6" textLength="514.8" lengthAdjust="spacingAndGlyphs">PHP  Laravel  Filament  Reverb  Symfony  Doctrine  Node.js  Prisma</text></g>
    <g class="out" style="animation-delay:1.08s"><text class="mono" x="28" y="138" font-size="13" fill="#6b7280">├──</text><text class="mono" x="59.2" y="138" font-size="13" font-weight="700" fill="#c0392b" textLength="70.2" lengthAdjust="spacingAndGlyphs">front-end</text></g>
    <g class="out" style="animation-delay:1.18s"><text class="mono" x="28" y="159" font-size="13" fill="#6b7280">│</text><text class="mono" x="59.2" y="159" font-size="13" fill="#6b7280">└──</text><text class="mono" x="90.4" y="159" font-size="13" font-weight="400" fill="#f3f4f6" textLength="319.8" lengthAdjust="spacingAndGlyphs">TypeScript  Vue 3  Pinia  React  Tailwind</text></g>
    <g class="out" style="animation-delay:1.26s"><text class="mono" x="28" y="180" font-size="13" fill="#6b7280">├──</text><text class="mono" x="59.2" y="180" font-size="13" font-weight="700" fill="#c0392b" textLength="148.2" lengthAdjust="spacingAndGlyphs">data-infrastructure</text></g>
    <g class="out" style="animation-delay:1.36s"><text class="mono" x="28" y="201" font-size="13" fill="#6b7280">│</text><text class="mono" x="59.2" y="201" font-size="13" fill="#6b7280">└──</text><text class="mono" x="90.4" y="201" font-size="13" font-weight="400" fill="#f3f4f6" textLength="546.0" lengthAdjust="spacingAndGlyphs">PostgreSQL  Redis  Keycloak  Docker  Kubernetes  nginx  GitHub Actions</text></g>
    <g class="out" style="animation-delay:1.44s"><text class="mono" x="28" y="222" font-size="13" fill="#6b7280">└──</text><text class="mono" x="59.2" y="222" font-size="13" font-weight="700" fill="#c0392b" textLength="124.8" lengthAdjust="spacingAndGlyphs">testing-services</text></g>
    <g class="out" style="animation-delay:1.54s"><text class="mono" x="28" y="243" font-size="13" fill="#6b7280"></text><text class="mono" x="59.2" y="243" font-size="13" fill="#6b7280">└──</text><text class="mono" x="90.4" y="243" font-size="13" font-weight="400" fill="#f3f4f6" textLength="280.8" lengthAdjust="spacingAndGlyphs">Pest  Vitest  Stripe  Resend  Sentry</text></g>
  </g>
</svg>
